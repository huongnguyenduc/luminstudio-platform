apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: prod
resources:
  - ../../base
  - namespace.yaml
  - api-gateway-ingress.yaml
  - db-migrate-job.yaml
labels:
  - pairs:
      app.kubernetes.io/managed-by: kustomize
      app.kubernetes.io/part-of: lumin-studio
      lumin.studio/environment: prod
images:
  - name: lumin/api-gateway
    newTag: prod
  - name: lumin/worker-3d
    newTag: prod
patches:
  - path: api-gateway-pullpolicy-patch.yaml
    target:
      kind: Deployment
      name: api-gateway
  - path: worker-pullpolicy-patch.yaml
    target:
      kind: Deployment
      name: worker-3d
# Thay thế secret dev (plaintext trong base) bằng giá trị prod đọc từ secrets/*.env.
# Các file *.env KHÔNG được commit (xem secrets/.gitignore); deploy-prod.sh sinh ngẫu nhiên
# lần đầu nếu chưa có.
secretGenerator:
  - name: postgres
    behavior: replace
    envs:
      - secrets/postgres.env
  - name: minio
    behavior: replace
    envs:
      - secrets/minio.env
  - name: meilisearch
    behavior: replace
    envs:
      - secrets/meilisearch.env
generatorOptions:
  disableNameSuffixHash: true
