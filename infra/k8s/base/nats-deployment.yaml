apiVersion: apps/v1
kind: Deployment
metadata:
  name: nats
  labels:
    app.kubernetes.io/name: nats
    app.kubernetes.io/component: event-bus
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: nats
  template:
    metadata:
      labels:
        app.kubernetes.io/name: nats
        app.kubernetes.io/component: event-bus
    spec:
      containers:
        - name: nats
          image: docker.io/library/nats:2.11.6-alpine
          args:
            - --http_port=8222
          ports:
            - name: client
              containerPort: 4222
            - name: monitoring
              containerPort: 8222
          startupProbe:
            httpGet:
              path: /healthz
              port: monitoring
            failureThreshold: 30
            periodSeconds: 2
          readinessProbe:
            httpGet:
              path: /healthz
              port: monitoring
            periodSeconds: 5
            timeoutSeconds: 2
          resources:
            requests:
              cpu: 25m
              memory: 32Mi
            limits:
              cpu: 250m
              memory: 128Mi
