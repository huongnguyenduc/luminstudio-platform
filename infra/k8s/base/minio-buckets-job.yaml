apiVersion: batch/v1
kind: Job
metadata:
  name: minio-buckets
  labels:
    app.kubernetes.io/name: minio
    app.kubernetes.io/component: object-storage
    app.kubernetes.io/part-of: lumin-studio
spec:
  backoffLimit: 6
  template:
    metadata:
      labels:
        app.kubernetes.io/name: minio-buckets
        app.kubernetes.io/component: object-storage
    spec:
      restartPolicy: OnFailure
      containers:
        - name: create-buckets
          image: docker.io/minio/minio:RELEASE.2024-08-03T04-33-23Z
          envFrom:
            - secretRef:
                name: minio
          command:
            - /bin/sh
            - -c
            - |
              set -eu
              until mc alias set dev-minio http://minio:9000 "$MINIO_ROOT_USER" "$MINIO_ROOT_PASSWORD"; do
                sleep 2
              done
              mc mb --ignore-existing dev-minio/lumin-source-glb
              mc mb --ignore-existing dev-minio/lumin-optimized-glb
              mc mb --ignore-existing dev-minio/lumin-360-sprites
