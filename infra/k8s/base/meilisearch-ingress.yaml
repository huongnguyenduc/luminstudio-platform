apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: meilisearch
  labels:
    app.kubernetes.io/name: meilisearch
    app.kubernetes.io/component: search
spec:
  ingressClassName: traefik
  rules:
    - host: search-dev.local
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: meilisearch
                port:
                  name: http
